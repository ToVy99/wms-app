name: Build WMS Scan Login v1.8 Windows EXE
on:
  push:
    branches: [wms-scan-login-v18-native-zoom]
    paths:
      - "tools/wms_scan_login/v1_8_source.zip.b64"
      - ".github/workflows/wms-scan-login-v18-windows.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract complete v1.8 source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scan_build | Out-Null
          python -c "import base64,hashlib,pathlib; b=base64.b64decode(pathlib.Path('tools/wms_scan_login/v1_8_source.zip.b64').read_text().strip()); assert hashlib.sha256(b).hexdigest() == 'd0c0826a92caa3a84f5776c76fc6fe755f6e14354d9feb159e83deca3b1a6940','Source checksum mismatch'; pathlib.Path('scan_build_source.zip').write_bytes(b); print('Verified source ZIP:',len(b))"
          if ($LASTEXITCODE -ne 0) { throw "Source checksum invalid" }
          Expand-Archive scan_build_source.zip -DestinationPath scan_build -Force
          if (-not (Test-Path scan_build/automation.py)) { throw 'Missing v1.8 automation.py' }
          if (-not (Test-Path scan_build/main.py)) { throw 'Missing v1.8 main.py' }
          if (-not (Test-Path scan_build/settings.py)) { throw 'Missing v1.8 settings.py' }
      - name: Install build and runtime dependencies
        working-directory: scan_build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate syntax, three-second delay, Win32 zoom safety, warehouse and station flow
        working-directory: scan_build
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Build Windows portable GUI and console diagnostic
        working-directory: scan_build
        shell: pwsh
        run: |
          $extra = @("--collect-all", "selenium", "--collect-all", "trio", "--collect-all", "trio_websocket", "--collect-all", "websocket", "--collect-all", "urllib3", "--collect-all", "certifi", "--collect-all", "sniffio", "--collect-all", "attrs", "--collect-binaries", "psutil")
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name WMS_Scan_Login @extra main.py
          if ($LASTEXITCODE -ne 0) { throw "Windows GUI build failed" }
          python -m PyInstaller --noconfirm --onefile --console --name WMS_Scan_Login_Diagnostic @extra main.py
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic build failed" }
      - name: Run frozen EXE Chrome/Station and no-CSS smoke test
        shell: pwsh
        run: |
          $gui = (Resolve-Path "scan_build/dist/WMS_Scan_Login.exe").Path
          $diag = (Resolve-Path "scan_build/dist/WMS_Scan_Login_Diagnostic.exe").Path
          if ((Get-Item $gui).Length -lt 2000000) { throw "EXE unexpectedly small" }
          $bytes = [System.IO.File]::ReadAllBytes($gui)
          if ($bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw "Invalid Windows executable header" }
          & $diag --self-test
          if ($LASTEXITCODE -ne 0) { throw "Frozen Selenium/Chrome smoke failed" }
          if (-not ((Get-Content wms_scan_smoke_result.txt -Raw) -match "PASS")) { throw "Missing Chrome PASS report" }
          & $gui --self-test
          if ($LASTEXITCODE -ne 0) { throw "GUI EXE smoke failed" }
      - name: Run frozen EXE UI smoke test
        shell: pwsh
        run: |
          & (Resolve-Path "scan_build/dist/WMS_Scan_Login_Diagnostic.exe").Path --ui-smoke
          if ($LASTEXITCODE -ne 0) { throw "Frozen UI smoke failed" }
          if (-not ((Get-Content wms_ui_smoke_result.txt -Raw) -match "PASS")) { throw "Missing GUI PASS report" }
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: WMS_Scan_Login_Windows_EXE_v1_8
          path: |
            scan_build/dist/WMS_Scan_Login.exe
            wms_scan_smoke_result.txt
            wms_ui_smoke_result.txt
          retention-days: 14
          if-no-files-found: error
