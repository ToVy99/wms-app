name: Build WMS Scan Login v1.9 Windows EXE
on:
  push:
    branches: [wms-scan-login-v19-zoom-maximized]
    paths:
      - "tools/wms_scan_login/v19_native_zoom.py.zlib.b64"
      - "tools/wms_scan_login/v19_zoom_tests.py"
      - ".github/workflows/wms-scan-login-v19-windows.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract verified v1.8 source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scan_build | Out-Null
          python -c "import base64,hashlib,pathlib; b=base64.b64decode(pathlib.Path('tools/wms_scan_login/v1_8_source.zip.b64').read_text().strip()); assert hashlib.sha256(b).hexdigest() == '3243e8ffe84226c01e362207a5dcdcf284f5e9bb66fa841a30a391628d9b8dbf'; pathlib.Path('scan_build_source.zip').write_bytes(b)"
          if ($LASTEXITCODE -ne 0) { throw 'Bad original source' }
          Expand-Archive scan_build_source.zip -DestinationPath scan_build -Force
      - name: Apply v1.9 native Chrome zoom correction
        shell: pwsh
        run: |
          python -c "import base64,zlib,hashlib,pathlib; encoded=pathlib.Path('tools/wms_scan_login/v19_native_zoom.py.zlib.b64').read_text().strip(); native=zlib.decompress(base64.b64decode(encoded)); assert hashlib.sha256(native).hexdigest() == '643010e2a5324e913c62187ab2a105dd01766ab4e0a0709c4faf205b08f99edd'; pathlib.Path('scan_build/native_zoom.py').write_bytes(native); print('Verified corrected native_zoom.py:',len(native),'bytes')"
          if ($LASTEXITCODE -ne 0) { throw 'Zoom code checksum mismatch' }
          Copy-Item tools/wms_scan_login/v19_zoom_tests.py scan_build/tests/test_v19_zoom.py
      - name: Install build dependencies
        working-directory: scan_build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile and run full regression suite
        working-directory: scan_build
        run: |
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw 'Python source syntax error' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Python regression suite failed' }
      - name: Build portable EXE and diagnostic launcher
        working-directory: scan_build
        shell: pwsh
        run: |
          $extra = @("--collect-all", "selenium", "--collect-all", "trio", "--collect-all", "trio_websocket", "--collect-all", "websocket", "--collect-all", "urllib3", "--collect-all", "certifi", "--collect-all", "sniffio", "--collect-all", "attrs", "--collect-all", "psutil")
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name WMS_Scan_Login @extra main.py
          if ($LASTEXITCODE -ne 0) { throw 'EXE build failed' }
          python -m PyInstaller --noconfirm --onefile --console --name WMS_Scan_Login_Diagnostic @extra main.py
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic build failed' }
      - name: Smoke-test actual Windows EXE, Chrome, station, interface
        shell: pwsh
        run: |
          $gui = (Resolve-Path "scan_build/dist/WMS_Scan_Login.exe").Path
          $diag = (Resolve-Path "scan_build/dist/WMS_Scan_Login_Diagnostic.exe").Path
          if ((Get-Item $gui).Length -lt 2000000) { throw "EXE unexpectedly small" }
          $h = [System.IO.File]::ReadAllBytes($gui)
          if ($h[0] -ne 77 -or $h[1] -ne 90) { throw "Not a Windows EXE" }
          & $diag --self-test
          if ($LASTEXITCODE -ne 0) { throw "Chrome/Selenium EXE smoke failed" }
          if (-not ((Get-Content wms_scan_smoke_result.txt -Raw) -match "PASS")) { throw "Browser smoke report missing" }
          & $gui --self-test
          if ($LASTEXITCODE -ne 0) { throw "GUI EXE smoke failed" }
          & $diag --ui-smoke
          if ($LASTEXITCODE -ne 0) { throw "UI smoke failed" }
          if (-not ((Get-Content wms_ui_smoke_result.txt -Raw) -match "PASS")) { throw "UI report missing" }
      - name: Upload EXE and smoke-test reports
        uses: actions/upload-artifact@v4
        with:
          name: WMS_Scan_Login_v1_9_Windows_EXE
          path: |
            scan_build/dist/WMS_Scan_Login.exe
            wms_scan_smoke_result.txt
            wms_ui_smoke_result.txt
          retention-days: 14
          if-no-files-found: error
