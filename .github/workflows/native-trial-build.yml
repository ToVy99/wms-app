name: Build IntraCity 3.4 Native Trial
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install testing dependencies
        shell: pwsh
        run: python -m pip install -r requirements-build.txt
      - name: Verify business logic and revised UI
        shell: pwsh
        run: python -m unittest -v test_native_prod_parity test_checkprod_34_static test_native_ui_static test_prod_native_layout test_area_buttons_release34 test_native_cot test_theme test_release33 test_sku_finder test_bridge34
  build:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Build and smoke-test EXE
        shell: pwsh
        run: ./build_windows.ps1
      - name: Upload trial EXE
        uses: actions/upload-artifact@v4
        with:
          name: IntraCity_3.4_Native_Trial_EXE
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IntraCity_3.4_Trial_Diagnostics
          path: |
            smoke-test-result.json
            smoke-gui.png
          if-no-files-found: ignore
