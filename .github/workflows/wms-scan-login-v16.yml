name: Build WMS Scan Login v1.6 Windows EXE
on:
  push:
    branches: [wms-scan-login-v16]
    paths:
      - "tools/wms_scan_login/source_v1_6.zip"
      - ".github/workflows/wms-scan-login-v16.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract v1.6 source archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path scan_build | Out-Null
          Expand-Archive -Path tools/wms_scan_login/source_v1_6.zip -DestinationPath scan_build -Force
          if (-not (Test-Path scan_build/automation.py)) { throw "Missing automation.py" }
          if (-not (Test-Path scan_build/main.py)) { throw "Missing main.py" }
      - name: Install dependencies
        working-directory: scan_build
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Dependency install failed" }
      - name: Validate and test workflow, warehouse switching, station scan
        working-directory: scan_build
        shell: pwsh
        run: |
          python -m compileall -q main.py automation.py settings.py tests
          if ($LASTEXITCODE -ne 0) { throw "Python compile failed" }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Unit and browser integration tests failed" }
      - name: Build portable GUI EXE
        working-directory: scan_build
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name WMS_Scan_Login --collect-all selenium --collect-all trio --collect-all trio_websocket --collect-all websocket --collect-all urllib3 --collect-all certifi --collect-all sniffio --collect-all attrs main.py
          if ($LASTEXITCODE -ne 0) { throw "EXE GUI build failed" }
      - name: Build diagnostic console EXE
        working-directory: scan_build
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --console --name WMS_Scan_Login_Diagnostic --collect-all selenium --collect-all trio --collect-all trio_websocket --collect-all websocket --collect-all urllib3 --collect-all certifi --collect-all sniffio --collect-all attrs main.py
          if ($LASTEXITCODE -ne 0) { throw "EXE console build failed" }
      - name: Smoke test frozen EXE Chrome and GUI
        shell: pwsh
        run: |
          $exe = (Resolve-Path scan_build/dist/WMS_Scan_Login.exe).Path
          $diagnostic = (Resolve-Path scan_build/dist/WMS_Scan_Login_Diagnostic.exe).Path
          if ((Get-Item $exe).Length -lt 2000000) { throw "EXE missing or too small" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw "Windows PE header missing" }
          & $diagnostic --self-test
          if ($LASTEXITCODE -ne 0) { throw "Selenium/Chrome/Station/Zoom smoke test failed" }
          if (-not ((Get-Content wms_scan_smoke_result.txt -Raw) -match "PASS")) { throw "Missing browser PASS" }
          & $diagnostic --ui-smoke
          if ($LASTEXITCODE -ne 0) { throw "UI settings smoke test failed" }
          if (-not ((Get-Content wms_ui_smoke_result.txt -Raw) -match "PASS")) { throw "Missing GUI PASS" }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "GUI EXE smoke test failed" }
          Get-Content wms_scan_smoke_result.txt
          Get-Content wms_ui_smoke_result.txt
      - name: Upload verified Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: WMS_Scan_Login_v1_6_Windows_EXE
          path: |
            scan_build/dist/WMS_Scan_Login.exe
            wms_scan_smoke_result.txt
            wms_ui_smoke_result.txt
          retention-days: 14
          if-no-files-found: error
