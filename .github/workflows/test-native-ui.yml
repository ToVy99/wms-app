name: IntraCity 3.4 Native UI Tests (No Build)
on:
  push:
    branches:
      - 'codex/intracity-34-native-ui-tests'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-only:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -r requirements-build.txt
      - name: Run native Prod calculation and UI checks
        shell: pwsh
        run: python -m unittest -v test_native_prod_parity test_checkprod_34_static test_native_ui_static test_prod_native_layout test_native_cot test_theme test_release33 test_sku_finder test_bridge34
