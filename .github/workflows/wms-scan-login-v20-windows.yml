name: Build WMS Scan Login v2.0 Windows EXE
on:
  push:
    branches: [wms-scan-login-v20-pack-intervention]
    paths:
      - "tools/wms_scan_login/v2_0_source.zip.b64"
      - ".github/workflows/wms-scan-login-v20-windows.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract verified v2.0 source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force scan_build | Out-Null
          python -c "import base64,hashlib,pathlib; b=base64.b64decode(pathlib.Path('tools/wms_scan_login/v2_0_source.zip.b64').read_text().strip()); assert hashlib.sha256(b).hexdigest() == '49842354177490dcbd1016b975e586699151e6d6215c05f5c0f71b54ba82700f', 'Source checksum invalid'; pathlib.Path('v20_source.zip').write_bytes(b); print('Verified WMS v2.0 ZIP',len(b))"
          if ($LASTEXITCODE -ne 0) { throw 'v2.0 source checksum mismatch' }
          Expand-Archive v20_source.zip -DestinationPath scan_build -Force
          foreach ($name in @('main.py','automation.py','pack.py','control.py','native_zoom.py','settings.py')) {
            if (-not (Test-Path (Join-Path 'scan_build' $name))) { throw "Missing $name" }
          }
      - name: Install Python dependencies
        working-directory: scan_build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate code and run regression plus PACK/controls synthetic tests
        working-directory: scan_build
        run: |
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { throw 'Source syntax error' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Unit/browser test failed' }
      - name: Package portable Windows executable
        working-directory: scan_build
        shell: pwsh
        run: |
          $extra = @('--collect-all', 'selenium', '--collect-all', 'trio', '--collect-all', 'trio_websocket', '--collect-all', 'websocket', '--collect-all', 'urllib3', '--collect-all', 'certifi', '--collect-all', 'sniffio', '--collect-all', 'attrs', '--collect-all', 'psutil')
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name WMS_Scan_Login @extra main.py
          if ($LASTEXITCODE -ne 0) { throw 'EXE build failed' }
          python -m PyInstaller --noconfirm --onefile --console --name WMS_Scan_Login_Diagnostic @extra main.py
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic build failed' }
      - name: Verify EXE and run frozen Chrome station/UI smoke tests
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'scan_build/dist/WMS_Scan_Login.exe').Path
          $diag = (Resolve-Path 'scan_build/dist/WMS_Scan_Login_Diagnostic.exe').Path
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 2000000 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Invalid Windows EXE' }
          & $diag --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Chrome/Station EXE failed' }
          if (-not ((Get-Content wms_scan_smoke_result.txt -Raw) -match 'PASS')) { throw 'Chrome smoke report missing' }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'GUI EXE failed' }
          & $diag --ui-smoke
          if ($LASTEXITCODE -ne 0) { throw 'GUI controls failed' }
          if (-not ((Get-Content wms_ui_smoke_result.txt -Raw) -match 'PASS')) { throw 'UI smoke report missing' }
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: WMS_Scan_Login_v2_0_Windows_EXE
          path: |
            scan_build/dist/WMS_Scan_Login.exe
            wms_scan_smoke_result.txt
            wms_ui_smoke_result.txt
          if-no-files-found: error
          retention-days: 14
