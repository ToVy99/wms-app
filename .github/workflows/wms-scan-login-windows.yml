name: Build WMS Scan Login Windows EXE
on:
  push:
    branches: [wms-scan-login-exe-build]
    paths:
      - "tools/wms_scan_login/**"
      - ".github/workflows/wms-scan-login-windows.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract v1.1 source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path scan_build | Out-Null
          Expand-Archive -Path tools/wms_scan_login/source.zip -DestinationPath scan_build -Force
      - name: Apply WMS Login v1.2 fixes
        run: |
          python tools/wms_scan_login/v1_2_fix.py
      - name: Apply optional station scan v1.3
        run: |
          python tools/wms_scan_login/v1_3_station_fix.py
      - name: Apply modern v1.4 CHECK / PACK interface
        shell: pwsh
        run: |
          python -c "import base64,zlib,pathlib,hashlib; p=pathlib.Path('tools/wms_scan_login/gui_v1_4_main.py.zlib.b64'); b=zlib.decompress(base64.b64decode(p.read_text().strip())); assert hashlib.sha256(b).hexdigest() == '595801100905b42f684e456cb5b9392f2242d320e9e5d3163af88fd139d1a355', 'GUI source checksum mismatch'; pathlib.Path('scan_build/main.py').write_bytes(b); print('Modern GUI restored:', len(b), 'bytes')"
      - name: Keep advanced settings visible on laptops
        run: |
          python tools/wms_scan_login/v1_4_ui_polish.py
      - name: Enable configurable 75 percent Chrome zoom (v1.5)
        shell: pwsh
        run: |
          python -c "import base64,zlib,pathlib; p=pathlib.Path('tools/wms_scan_login/v1_5_zoom_patch.py.zlib.b64'); b=zlib.decompress(base64.b64decode(p.read_text().strip())); pathlib.Path('scan_build/apply_v15.py').write_bytes(b); print('Zoom patch:', len(b), 'bytes')"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot decompress zoom patch' }
          python tools/wms_scan_login/v1_5_prepatch.py
          if ($LASTEXITCODE -ne 0) { throw 'Cannot normalize station input for v1.5' }
          python scan_build/apply_v15.py
          if ($LASTEXITCODE -ne 0) { throw 'Cannot apply v1.5 zoom patch' }
          python tools/wms_scan_login/v1_5_smoke_patch.py
          if ($LASTEXITCODE -ne 0) { throw 'Cannot patch high DPI smoke test' }
      - name: Inspect previous Chrome flow for compatible v1.6 patch
        shell: pwsh
        run: |
          python -c "from pathlib import Path; a=Path('scan_build/automation.py').read_text(encoding='utf-8'); print('---WMS-FLOW---'); print(a[a.index('            # A login tab can usually be closed'):][-4000:]); print('---END-WMS-FLOW---')"
      - name: Add CHECK/PACK warehouse selector and delayed zoom (v1.6)
        shell: pwsh
        run: |
          python -c "from pathlib import Path; s=Path('scan_build/automation.py').read_text(encoding='utf-8'); print(s[-3000:].encode('ascii','backslashreplace').decode())"
          python tools/wms_scan_login/v1_6_warehouse_delay.py
          if ($LASTEXITCODE -ne 0) { throw "Failed to apply v1.6 warehouse/zoom patch" }
      - name: Install Python dependencies
        working-directory: scan_build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate Python and URL behavior
        working-directory: scan_build
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Build portable Windows EXE with complete Selenium
        working-directory: scan_build
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name WMS_Scan_Login --collect-all selenium --collect-all trio --collect-all trio_websocket --collect-all websocket --collect-all urllib3 --collect-all certifi --collect-all sniffio --collect-all attrs main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
      - name: Build console diagnostic launcher
        working-directory: scan_build
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --console --name WMS_Scan_Login_Diagnostic --collect-all selenium --collect-all trio --collect-all trio_websocket --collect-all websocket --collect-all urllib3 --collect-all certifi --collect-all sniffio --collect-all attrs main.py
          if ($LASTEXITCODE -ne 0) { throw "Diagnostic PyInstaller build failed" }
      - name: Smoke test the frozen EXE and headless Chrome
        shell: pwsh
        run: |
          $exe = (Resolve-Path "scan_build/dist/WMS_Scan_Login.exe").Path
          if ((Get-Item $exe).Length -lt 2000000) { throw "EXE unexpectedly small" }
          $header = [System.IO.File]::ReadAllBytes($exe)
          if ($header[0] -ne 77 -or $header[1] -ne 90) { throw "Invalid Windows PE header" }
          & (Resolve-Path "scan_build/dist/WMS_Scan_Login_Diagnostic.exe").Path --self-test
          $testExit = $LASTEXITCODE
          if (Test-Path wms_scan_smoke_result.txt) { Get-Content wms_scan_smoke_result.txt }
          if ($testExit -ne 0) { throw "Frozen app/Chrome smoke test failed (diagnostic EXE)" }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Frozen GUI app smoke test failed" }
          if (-not ((Get-Content wms_scan_smoke_result.txt -Raw) -match "PASS")) { throw "Smoke test result missing" }
      - name: Smoke test modern GUI
        shell: pwsh
        run: |
          & (Resolve-Path "scan_build/dist/WMS_Scan_Login_Diagnostic.exe").Path --ui-smoke
          $uiExit = $LASTEXITCODE
          if (Test-Path wms_ui_smoke_result.txt) { Get-Content wms_ui_smoke_result.txt }
          if ($uiExit -ne 0) { throw "UI smoke test failed" }
          if (-not ((Get-Content wms_ui_smoke_result.txt -Raw) -match "PASS")) { throw "GUI test did not pass" }
      - name: Upload EXE and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: WMS_Scan_Login_Windows_EXE_v1_6
          path: |
            scan_build/dist/WMS_Scan_Login.exe
            wms_scan_smoke_result.txt
            wms_ui_smoke_result.txt
          if-no-files-found: error
          retention-days: 7
