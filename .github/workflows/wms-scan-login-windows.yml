name: Build WMS Scan Login Windows EXE
on:
  push:
    branches: [wms-scan-login-exe-build]
    paths:
      - "tools/wms_scan_login/**"
      - ".github/workflows/wms-scan-login-windows.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path scan_build | Out-Null
          Expand-Archive -Path tools/wms_scan_login/source.zip -DestinationPath scan_build -Force
      - name: Install Python dependencies
        working-directory: scan_build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate source and settings
        working-directory: scan_build
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Build portable Windows EXE
        working-directory: scan_build
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name WMS_Scan_Login --collect-data selenium --collect-binaries selenium main.py
      - name: Check binary
        shell: pwsh
        run: |
          $exe = "scan_build/dist/WMS_Scan_Login.exe"
          if (-not (Test-Path $exe)) { throw "EXE file missing" }
          if ((Get-Item $exe).Length -lt 2000000) { throw "EXE unexpectedly small" }
          $header = [System.IO.File]::ReadAllBytes($exe)
          if ($header[0] -ne 77 -or $header[1] -ne 90) { throw "Invalid PE header" }
          Write-Host "EXE OK: $((Get-Item $exe).Length) bytes"
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WMS_Scan_Login_Windows_EXE
          path: scan_build/dist/WMS_Scan_Login.exe
          if-no-files-found: error
          retention-days: 7
