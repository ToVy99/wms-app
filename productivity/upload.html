<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cập nhật Station mapping</title>
<link rel="stylesheet" href="upload.css">
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="intra_host.js"></script>
</head>
<body>
<main>
  <header>
    <img src="../wms_bridge_icon.png" width="40" height="40" alt="">
    <h1>Cập nhật Station mapping</h1>
  </header>

  <p class="lead">Tải file Excel (.xlsx) để cập nhật tên Station. Cột A là Station ID (ví dụ CS00130, PS00094 hoặc SS00226), cột B là tên Station. Chỉ đọc sheet đầu tiên.</p>

  <section id="current" class="card"></section>

  <section class="card">
    <label id="drop" class="drop" for="file">
      <span class="drop-title">Chọn file .xlsx</span>
      <span class="drop-sub">hoặc kéo file vào đây</span>
    </label>
    <input id="file" type="file" accept=".xlsx" hidden>
    <p id="error" class="msg error" hidden></p>
    <div id="result" class="result" hidden></div>
  </section>

  <button type="button" id="reset" class="plain">Khôi phục bảng Station mặc định</button>
</main>
<script src="xlsx.js"></script>
<script src="upload.js"></script>
</body>
</html>
